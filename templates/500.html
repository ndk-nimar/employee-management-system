{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong · Northwind HR</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'employees/css/style.css' %}" rel="stylesheet">
</head>
<body class="error-body">
  <main class="error-shell">
    <p class="error-code">500</p>
    <h1>The server hit an error</h1>
    <p class="error-copy">
      The request could not be completed. Nothing was saved. Reload the page,
      and if it keeps happening check the server logs.
    </p>
    <div class="error-actions">
      <a href="/" class="btn btn-primary">Back to dashboard</a>
    </div>
  </main>
</body>
</html>
