{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Northwind HR</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{% static 'employees/css/style.css' %}" rel="stylesheet">
</head>
<body class="error-body">
  <main class="error-shell">
    <p class="error-code">404</p>
    <h1>We couldn't find that page</h1>
    <p class="error-copy">
      The link may be out of date, or the employee record was deleted.
      Try the directory instead.
    </p>
    <div class="error-actions">
      <a href="{% url 'employees:dashboard' %}" class="btn btn-primary">Go to dashboard</a>
      <a href="{% url 'employees:employee_list' %}" class="btn btn-ghost">View employees</a>
    </div>
  </main>
</body>
</html>
